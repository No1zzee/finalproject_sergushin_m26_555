[project]
name = "finalproject_sergushin_m26_555"
version = "0.1.0"
description = "Консольная платформа для симуляции торговли валютами"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"