[project]
name = "finalproject_sergushin_m26_555"
version = "0.1.0"
description = "Консольная платформа для симуляции торговли валютами"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.valutatrade]
parser_log_file = "parser.log"
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"

rates_ttl_seconds = 300
default_base_currency = "USD"

log_dir = "logs"
log_file = "actions.log"
log_level = "INFO"
log_format = "json"
log_max_bytes = 1048576
log_backup_count = 3
